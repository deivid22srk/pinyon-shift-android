name: Build Android APK

on:
  push:
    branches: [android-port, main, dev]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Newer commits supersede in-flight runs of the same ref: the loop keeps the
# queue short without paying for builds of stale states.
concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    name: Build APK (arm64 device)
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      XEX_TOKEN: ${{ secrets.XEX_REPO_TOKEN }}
      # Opts the Gradle/CMake build into ccache launchers (see build.gradle).
      PINYON_CCACHE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # The NDK tree compiles ~1200 targets; warm ccache turns most follow-up
      # runs into recompiles of the files that actually changed.
      - name: Restore ccache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: ccache-arm64-${{ runner.os }}-${{ hashFiles('src/**', 'include/**', 'tests/**', 'thirdparty/shiftglue-sdk/src/**', 'thirdparty/shiftglue-sdk/include/**', 'CMakeLists.txt', 'cmake/**', 'config/rexglue/**', 'android/app/CMakeLists.txt', 'android/app/build.gradle') }}
          restore-keys: ccache-arm64-${{ runner.os }}-

      - name: Restore Gradle caches
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/wrapper
            ~/.gradle/caches
          key: gradle-${{ runner.os }}-${{ hashFiles('android/gradle/wrapper/gradle-wrapper.properties', 'android/app/build.gradle') }}
          restore-keys: gradle-${{ runner.os }}-

      # Fail fast on release-contract drift (for example an SDK submodule
      # bump that missed the release-toolchain pin) before paying for the
      # native build. The Linux suite skips the PowerShell-only tests.
      - name: Test release tooling
        run: python3 -m unittest discover -s tools/tests -p "test_*.py"

      - name: Install pinned Android SDK components
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-35" "build-tools;35.0.0" \
            "ndk;27.2.12479018" "cmake;3.31.6" > /dev/null

      - name: Install Linux build dependencies for the host-side generator
        run: |
          sudo apt-get update > /dev/null
          sudo apt-get install -y \
            libasound2-dev libpulse-dev libpipewire-0.3-dev \
            libx11-xcb-dev libwayland-dev libxkbcommon-dev wayland-protocols \
            ccache

      - name: Configure ccache
        run: |
          ccache --set-config=max_size=5G
          ccache --set-config=compiler_check=content
          # The build uses target_precompile_headers; without this sloppiness
          # ccache misses every TU compiled with a PCH.
          ccache --set-config=sloppiness=pch_defines,time_macros
          ccache --zero-stats

      - name: Install clang 20 for the generator (matches the SDK toolchain)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends software-properties-common lsb-release wget
          wget -qO llvm.sh https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh 20
          sudo update-alternatives --install /usr/bin/clang clang /usr/bin/clang-20 200
          sudo update-alternatives --install /usr/bin/clang++ clang++ /usr/bin/clang++-20 200
          clang++ --version | head -1

      - name: Verify the three game executables are loadable
        if: env.XEX_TOKEN != ''
        run: |
          API=https://api.github.com/repos/deivid22srk/Forza1files
          mkdir -p .local/game/base .local/logs
          curl -sf -H "Authorization: token $XEX_TOKEN" "$API/releases/tags/Files" -o /tmp/release.json
          python3 - <<'PY'
          import json, os, subprocess, sys
          rel = json.load(open('/tmp/release.json'))
          token = os.environ['XEX_TOKEN']
          expected = {'default.xex', 'SpeechFacade_default.xex', 'XMediaFacade_default.xex'}
          found = {a['name']: a for a in rel.get('assets', []) if a['name'] in expected}
          missing = expected - set(found)
          if missing:
              sys.exit(f"missing release assets: {missing}")
          for name, a in found.items():
              out = f".local/game/base/{name}"
              subprocess.run([
                  'curl', '-sfL',
                  '-H', f'Authorization: token {token}',
                  '-H', 'Accept: application/octet-stream',
                  '-o', out, a['url'],
              ], check=True)
              print(name, os.path.getsize(out), 'bytes')
          PY

      - name: Check the executables against the supported-dumps manifest
        run: |
          python3 - <<'PY'
          import hashlib, json, sys
          doc = json.load(open('config/supported-dumps.json'))
          for exe in doc['dumps'][0]['executables']:
              path = '.local/game/base/' + exe['guest_path']
              data = open(path, 'rb').read()
              if len(data) != exe['size_bytes']:
                  sys.exit(f"{exe['guest_path']}: bad size")
              digest = hashlib.sha256(data).hexdigest().upper()
              if digest != exe['sha256']:
                  sys.exit(f"{exe['guest_path']}: bad sha256")
              print(exe['guest_path'], 'verified')
          PY

      - name: Build the code generator (x86-64 host tool)
        run: |
          cd thirdparty/shiftglue-sdk
          cmake --preset linux-amd64
          cmake --build out/build/linux-amd64 --config Release --target rexglue --parallel 4

      - name: Generate the recompiled sources from the executables
        run: |
          thirdparty/shiftglue-sdk/out/linux-amd64/Release/rexglue \
            --log-level info --log-file .local/logs/codegen.log \
            codegen config/rexglue/pinyon_shift_manifest.toml --ignore-stamp
          du -sh .local/generated/*
          # The generator build tree is not needed past this point.
          rm -rf thirdparty/shiftglue-sdk/out/build

      - name: Build the device APK (arm64, release)
        run: |
          # Release falls back to the debug key when no release keystore is
          # configured; create it so fresh runners can sign.
          mkdir -p ~/.android
          [ -f ~/.android/debug.keystore ] || keytool -genkeypair -v \
            -keystore ~/.android/debug.keystore -storepass android -keypass android \
            -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US" > /dev/null
          cd android
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          ./gradlew :app:assembleDeviceRelease --no-daemon --stacktrace

      - name: Show ccache stats
        run: ccache --show-stats

      - name: Stage the APK for inspection
        run: |
          find android/app/build/outputs -name "*.apk" | xargs -I{} sh -c 'echo "{}: $(du -h "{}" | cut -f1)"'

      - name: Verify 16 KB ELF alignment (Android 15+ page-size devices)
        run: |
          READELF="$ANDROID_HOME/ndk/27.2.12479018/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf"
          APK=$(find android/app/build/outputs/apk/device/release -name '*.apk' | head -1)
          [ -n "$APK" ] || { echo "ERROR: release APK not found"; exit 1; }
          TMP=$(mktemp -d)
          unzip -q "$APK" 'lib/*' -d "$TMP"
          LIBS=$(find "$TMP/lib" -name '*.so')
          [ -n "$LIBS" ] || { echo "ERROR: no native libraries in APK"; exit 1; }
          fail=0
          for so in $LIBS; do
            max=0
            for a in $("$READELF" -lW "$so" | awk '$1=="LOAD" {print $NF}'); do
              v=$(( a ))
              [ "$v" -gt "$max" ] && max=$v
            done
            echo "$(basename "$so"): max LOAD p_align = $max"
            if [ "$max" -lt 16384 ]; then
              echo "ERROR: $(basename "$so") is not 16 KB aligned (max $max)"
              fail=1
            fi
          done
          exit $fail

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: pinyon-shift-apk
          if-no-files-found: error
          path: android/app/build/outputs/apk/device/release/*.apk
